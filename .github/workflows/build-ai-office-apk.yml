name: Build AI Office APK

on:
  push:
    branches:
      - ai-office-apk-build
    paths:
      - 'android-ai-office/**'
      - '.github/workflows/build-ai-office-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android-ai-office
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-ai-office/app/build/outputs/apk/debug/app-debug.apk AI办公助手-v1.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI办公助手-v1.0-APK
          path: AI办公助手-v1.0-debug.apk
